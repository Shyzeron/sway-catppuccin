# ~/.config/foot/foot.ini
# Catppuccin Mocha + прозрачность

[main]
term=xterm-256color
font=JetBrainsMono Nerd Font:size=12
dpi-aware=yes
pad=12x8

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.85

background=1e1e2e
foreground=cdd6f4

# цвет текста под курсором, цвет курсора
cursor=1e1e2e f5e0dc

selection-foreground=1e1e2e
selection-background=f5e0dc

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8
